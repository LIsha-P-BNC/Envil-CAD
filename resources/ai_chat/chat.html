<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anvil AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    /* Envil "Vibrant Purple & Indigo" — matches the KiCad frame chrome. */
    --bg-0:        #18142a;
    --bg-1:        #211b38;
    --bg-2:        #2a2348;
    --bg-3:        #322a55;
    --bg-input:    #1e1933;
    --border-1:    #3a2e63;
    --border-2:    #4a3d78;
    --border-acc:  #5e4e92;
    --text-1:      #f1f0fa;
    --text-2:      #c4bedd;
    --text-3:      #8b85a8;
    --text-4:      #5e5878;
    --user-grad-1: #7c3aed;
    --user-grad-2: #9d5bf0;
    --ai-bubble:   #241f3c;
    --ai-border:   #3a2e63;
    --accent:      #8b5cf6;
    --accent-hi:   #a78bfa;
    --accent-soft: rgba(139,92,246,.14);
    --ok:          #34d399;
    --warn:        #fbbf24;
    --err:         #f87171;
    --shadow-sm:   0 1px 2px rgba(0,0,0,.4);
    --shadow-md:   0 4px 16px rgba(0,0,0,.45);
    --radius-sm:   6px;
    --radius:      10px;
    --radius-lg:   14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg-0);
    color: var(--text-1);
    font: 14px/1.5 "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
    font-feature-settings: "cv11", "ss01", "ss03";
    display: flex; flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-acc); }

  /* ── Header ─────────────────────────────────────────── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    background: var(--bg-1);
    border-bottom: 1px solid var(--border-1);
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-logo {
    width: 34px; height: 34px;
    display: grid; place-items: center;
  }
  .brand-logo img { width: 34px; height: 34px; object-fit: contain; display: block; }
  .brand-text .name { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
  .brand-text .sub  { font-size: 11px; color: var(--text-3); margin-top: 1px; }

  .status {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 10px;
    background: var(--bg-2);
    border: 1px solid var(--border-1);
    border-radius: 999px;
    font-size: 11px; font-weight: 500;
    color: var(--text-2);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-4); }
  .dot.connected   { background: var(--ok);  box-shadow: 0 0 8px rgba(52,211,153,.6); }
  .dot.connecting  { background: var(--warn); animation: pulse 1.2s infinite; }
  .dot.disconnected { background: var(--err); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .newchat-btn { color: var(--text-2); }
  .newchat-btn:hover { color: var(--accent-hi); background: var(--accent-soft); }

  /* ── Context bar ────────────────────────────────────── */
  #ctxBar {
    display: none;
    padding: 8px 18px; font-size: 12px; color: var(--text-2);
    background: var(--bg-2); border-bottom: 1px solid var(--border-1);
  }
  #ctxBar.active { display: flex; align-items: center; gap: 7px; }
  #ctxBar .label { color: var(--text-3); }
  #ctxBar .ctx-proj {
    color: var(--text-2); font-weight: 600;
  }
  #ctxBar .ctx-sep { color: var(--text-3); opacity: .6; }
  #ctxBar code {
    color: var(--accent-hi);
    font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
    font-size: 11px;
  }
  /* "whole project" hint dot — signals the AI sees the entire project,
     this file is just the one in focus. */
  #ctxBar .ctx-scope {
    margin-left: auto; color: var(--text-3); font-size: 10.5px;
    opacity: .8; white-space: nowrap;
  }

  /* ── Messages ───────────────────────────────────────── */
  #messages {
    flex: 1; overflow-y: auto;
    padding: 20px 18px;
    display: flex; flex-direction: column; gap: 14px;
    scroll-behavior: smooth;
  }
  .row { display: flex; gap: 10px; align-items: flex-start; max-width: 100%; }
  .row.user { flex-direction: row-reverse; }
  .avatar {
    flex-shrink: 0; width: 28px; height: 28px;
    border-radius: 8px;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 600; color: #fff;
    box-shadow: var(--shadow-sm);
  }
  .avatar.ai   { background: transparent; }
  .avatar.user { background: linear-gradient(135deg, #444c66, #2a3148); color: var(--text-1); }
  .avatar svg  { width: 14px; height: 14px; }

  .bubble {
    max-width: 100%;
    padding: 10px 14px;
    border-radius: var(--radius-lg);
    font-size: 13.5px; line-height: 1.55;
    word-wrap: break-word; overflow-wrap: break-word;
  }
  .bubble.user {
    background: linear-gradient(135deg, var(--user-grad-1), var(--user-grad-2));
    color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: var(--shadow-sm);
  }
  .bubble.ai {
    background: var(--ai-bubble);
    border: 1px solid var(--ai-border);
    color: var(--text-1);
    border-bottom-left-radius: 4px;
  }
  .bubble.ai p, .bubble.user p { white-space: pre-wrap; }

  .bubble code {
    background: rgba(0,0,0,.3); padding: 1px 6px; border-radius: 4px;
    font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
    font-size: 12.5px;
  }
  .bubble.user code { background: rgba(255,255,255,.15); }
  .bubble pre {
    background: var(--bg-0);
    border: 1px solid var(--border-1);
    padding: 10px 12px; border-radius: var(--radius-sm);
    overflow-x: auto; margin: 8px 0; font-size: 12.5px;
  }
  .bubble pre code { background: transparent; padding: 0; font-size: inherit; }
  .bubble strong { font-weight: 600; }

  .system-msg {
    align-self: center;
    color: var(--text-3); font-size: 11.5px;
    padding: 4px 12px; background: var(--bg-2);
    border-radius: 999px; border: 1px solid var(--border-1);
    max-width: 80%; text-align: center;
  }

  /* ─── Schematic summary card ─────────────────────────────────────── */
  .envil-summary {
    align-self: stretch;
    margin: 6px 0 4px;
    padding: 14px 16px;
    background: var(--bg-2);
    border: 1px solid var(--border-1);
    border-radius: var(--radius);
    font-size: 12.5px; color: var(--text-1);
    box-shadow: 0 1px 0 rgba(0,0,0,.15);
  }
  .es-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; margin-bottom: 10px;
  }
  .es-file {
    font-size: 13.5px; font-weight: 600; color: var(--text-1);
    letter-spacing: -.01em;
  }
  .es-stats { font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
  .es-rails {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 12px;
  }
  .es-chip {
    display: inline-block;
    padding: 2px 8px;
    background: rgba(139,92,246,.12);
    border: 1px solid rgba(139,92,246,.3);
    border-radius: 999px;
    font-size: 11px; font-weight: 500; color: #c4b5fd;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  .es-status {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    margin-bottom: 12px;
    font-size: 12px; font-weight: 500;
  }
  .es-status-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 50%;
    font-size: 12px; font-weight: 700;
    background: rgba(255,255,255,.15);
  }
  .es-status-label { flex: 1; }
  .es-status-count { font-size: 11px; opacity: .75; font-weight: 400; }
  .es-status-ok   { background: rgba(74,222,128,.10); border: 1px solid rgba(74,222,128,.3); color: #86efac; }
  .es-status-info { background: rgba(139,92,246,.10); border: 1px solid rgba(139,92,246,.3); color: #c4b5fd; }
  .es-status-warn { background: rgba(251,191,36,.10); border: 1px solid rgba(251,191,36,.3); color: #fcd34d; }
  .es-status-err  { background: rgba(248,113,113,.10); border: 1px solid rgba(248,113,113,.35); color: #fca5a5; }

  .es-sev {
    margin-top: 8px;
    border: 1px solid var(--border-1);
    border-radius: var(--radius-sm);
    background: var(--bg-3);
    overflow: hidden;
  }
  .es-sev > summary {
    list-style: none;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 12px; font-weight: 500;
    user-select: none;
  }
  .es-sev > summary::-webkit-details-marker { display: none; }
  .es-sev > summary:hover { background: rgba(255,255,255,.03); }
  .es-sev-dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
  }
  .es-sev-name { flex: 1; color: var(--text-1); }
  .es-sev-num {
    font-size: 11px; padding: 1px 8px;
    background: rgba(255,255,255,.06);
    border-radius: 999px; color: var(--text-2);
  }
  .es-sev-crit .es-sev-dot { background: #f87171; box-shadow: 0 0 0 2px rgba(248,113,113,.18); }
  .es-sev-high .es-sev-dot { background: #fb923c; box-shadow: 0 0 0 2px rgba(251,146,60,.18); }
  .es-sev-med  .es-sev-dot { background: #fcd34d; box-shadow: 0 0 0 2px rgba(252,211,77,.18); }

  .es-cat {
    padding: 6px 12px 4px;
    font-size: 10.5px; font-weight: 600;
    color: var(--text-3);
    text-transform: uppercase; letter-spacing: .06em;
  }
  .es-cat-num { font-weight: 400; opacity: .7; }
  .es-items {
    list-style: none;
    margin: 0; padding: 0 12px 8px;
  }
  .es-items li {
    display: flex; flex-wrap: wrap; gap: 6px;
    align-items: baseline;
    padding: 4px 0;
    font-size: 12px; line-height: 1.45;
    border-top: 1px solid rgba(255,255,255,.04);
  }
  .es-items li:first-child { border-top: none; }
  .es-ref {
    display: inline-block;
    padding: 1px 6px;
    background: rgba(255,255,255,.06);
    border-radius: 4px;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 11px; color: var(--text-1);
    flex-shrink: 0;
  }
  .es-title { color: var(--text-1); font-weight: 500; }
  .es-detail {
    flex-basis: 100%;
    color: var(--text-3); font-size: 11px;
    padding-left: 0; margin-top: 2px;
  }
  .es-empty {
    padding: 10px 12px;
    background: rgba(74,222,128,.06);
    border: 1px dashed rgba(74,222,128,.25);
    border-radius: var(--radius-sm);
    color: #86efac; font-size: 12px; text-align: center;
  }
  .es-circuit {
    padding: 6px 10px;
    margin-bottom: 8px;
    background: rgba(139,92,246,.10);
    border-left: 3px solid rgba(139,92,246,.55);
    border-radius: 4px;
    font-size: 12.5px; font-weight: 600;
    color: #cbd5e1;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    letter-spacing: -.01em;
  }
  .error-msg {
    align-self: center;
    color: var(--err); font-size: 12.5px;
    padding: 8px 14px;
    background: rgba(248,113,113,.08);
    border: 1px solid rgba(248,113,113,.3);
    border-radius: var(--radius);
    max-width: 90%;
  }

  .attachment {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 10px; margin-top: 8px;
    background: rgba(0,0,0,.25); border: 1px solid var(--border-acc);
    border-radius: var(--radius-sm);
    font-size: 11.5px; color: var(--text-2);
  }
  .attachment img {
    max-height: 120px; max-width: 240px; border-radius: 4px;
    display: block; margin: 0;
  }
  .attachment.image { padding: 4px; background: transparent; border: 1px solid var(--border-acc); }

  .thinking {
    display: none;
    padding: 6px 18px; font-size: 12px; color: var(--text-3);
    align-items: center; gap: 8px;
  }
  .thinking.active { display: flex; }
  .think-dots span {
    display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--text-3); margin: 0 1px;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .think-dots span:nth-child(2) { animation-delay: .15s; }
  .think-dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(.6); opacity: .4; }
    40%           { transform: scale(1.0); opacity: 1; }
  }

  /* Collapsible "Thinking" panel — streams the model's real reasoning
     (Claude.ai-style). Expanded while the model reasons, auto-collapses
     once the actual reply starts; click the header to toggle. Only ever
     rendered when chat_ui.thinking is enabled server-side. */
  .think-panel {
    margin: 4px 18px 10px; border: 1px solid var(--border-1);
    border-radius: var(--radius-sm); background: var(--bg-3);
    font-size: 12px; overflow: hidden;
  }
  .think-panel .tp-head {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 10px; cursor: pointer; user-select: none;
    color: var(--text-2);
  }
  .think-panel .tp-head:hover { color: var(--accent-hi); }
  .think-panel .tp-chevron {
    display: inline-flex; transition: transform .15s ease; opacity: .8;
  }
  .think-panel.collapsed .tp-chevron { transform: rotate(-90deg); }
  .think-panel .tp-label { flex: 1; }
  .think-panel .tp-spark {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent-hi);
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .think-panel.done .tp-spark { display: none; }
  .think-panel .tp-body {
    padding: 2px 12px 10px 12px; color: var(--text-3);
    white-space: pre-wrap; word-break: break-word;
    max-height: 260px; overflow-y: auto; line-height: 1.5;
    border-top: 1px solid var(--border-1);
  }
  .think-panel.collapsed .tp-body { display: none; }

  .ops {
    margin-top: 10px; padding: 10px 12px;
    background: var(--bg-3); border: 1px solid var(--border-1);
    border-radius: var(--radius-sm);
  }
  .ops-title {
    font-size: 11px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px;
  }
  .op-item {
    font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
    font-size: 11.5px; color: var(--text-1);
    padding: 3px 0; border-bottom: 1px dashed var(--border-1);
  }
  .op-item:last-child { border-bottom: none; }

  .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  .btn {
    border: none; cursor: pointer;
    padding: 7px 16px; font: inherit; font-weight: 500; font-size: 12.5px;
    border-radius: var(--radius-sm);
    transition: background .12s, transform .05s, box-shadow .12s;
  }
  .btn.primary {
    background: var(--accent); color: #0b0d12;
    box-shadow: 0 1px 0 rgba(255,255,255,.1) inset, 0 2px 8px rgba(139,92,246,.35);
  }
  .btn.primary:hover { background: var(--accent-hi); }
  .btn.secondary {
    background: transparent; color: var(--text-2);
    border: 1px solid var(--border-2);
  }
  .btn.secondary:hover { color: var(--text-1); border-color: var(--border-acc); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ── Footer ─────────────────────────────────────────── */
  footer {
    background: var(--bg-1);
    border-top: 1px solid var(--border-1);
    padding: 12px 14px 14px;
    flex-shrink: 0;
  }
  .pending {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 4px 4px 10px;
    background: var(--bg-2); border: 1px solid var(--border-1);
    color: var(--text-2); font-size: 11.5px;
    border-radius: 999px;
  }
  .chip .x {
    cursor: pointer; color: var(--text-3); padding: 0 6px;
    border-radius: 999px; line-height: 1;
  }
  .chip .x:hover { color: var(--err); background: rgba(248,113,113,.1); }

  .input-shell {
    display: flex; gap: 8px; align-items: flex-end;
    background: var(--bg-input);
    border: 1px solid var(--border-1);
    border-radius: var(--radius);
    padding: 8px 8px 8px 12px;
    transition: border-color .15s;
  }
  .input-shell:focus-within {
    border-color: var(--border-acc);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  #input {
    flex: 1; background: transparent; color: var(--text-1);
    border: none; font: inherit; font-size: 13.5px;
    resize: none; max-height: 140px; line-height: 1.5;
    padding: 4px 0;
  }
  #input:focus { outline: none; }
  #input::placeholder { color: var(--text-4); }

  .icon-btn {
    background: transparent; border: none; cursor: pointer;
    color: var(--text-3); width: 32px; height: 32px;
    border-radius: var(--radius-sm);
    display: grid; place-items: center;
    transition: background .12s, color .12s;
  }
  .icon-btn:hover { background: var(--bg-2); color: var(--text-1); }
  .icon-btn svg { width: 16px; height: 16px; }
  .send-btn {
    background: var(--accent); color: #0b0d12;
    box-shadow: 0 2px 6px rgba(139,92,246,.3);
    transition: background .12s, color .12s;
  }
  .send-btn:hover { background: var(--accent-hi); color: #0b0d12; }
  /* Stop button — Envil purple theme, same family as the send button */
  .send-btn.stop-mode {
    background: var(--bg-3);
    color: var(--accent-hi);
    box-shadow: 0 0 0 2px var(--border-acc);
    border: none;
  }
  .send-btn.stop-mode:hover { background: var(--border-acc); color: #fff; }

  /* ── Claude-style message action row ─────────────────────
     Sits below each bubble, hidden until the row is hovered.
     AI messages: left-aligned (under the bubble).
     User messages: right-aligned (mirror of the bubble).       */
  .msg-actions {
    display: flex; align-items: center; gap: 2px;
    margin-top: 4px;
    opacity: 0.3;
    transition: opacity 150ms ease;
    height: 26px;
  }
  .row:hover .msg-actions,
  .row.hov   .msg-actions { opacity: 1; }
  .row.user  .msg-actions { justify-content: flex-end; }

  .act-btn {
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; padding: 0;
    border: none; border-radius: 6px;
    background: transparent;
    color: var(--text-3);
    cursor: pointer;
    transition: background 120ms, color 120ms;
    flex-shrink: 0;
  }
  .act-btn svg { width: 14px; height: 14px; }
  .act-btn:hover { background: var(--bg-3); color: var(--accent-hi); }
  /* Confirmed (copy success) state: brief green flash */
  .act-btn.copied { color: var(--ok); }
  /* User bubble: slightly lighter base so icons read on the dark panel bg */
  .row.user .act-btn { color: var(--text-3); }
  .row.user .act-btn:hover { background: var(--bg-2); color: var(--accent-hi); }

  .footer-hint {
    font-size: 11px; color: var(--text-4); margin-top: 8px; text-align: center;
  }
  .footer-hint kbd {
    background: var(--bg-2); border: 1px solid var(--border-1);
    padding: 1px 5px; border-radius: 3px;
    font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
    font-size: 10px; color: var(--text-2);
  }

  /* ── Empty state ────────────────────────────────────── */
  .empty {
    display: flex; flex-direction: column; align-items: center;
    text-align: center; margin: 60px 20px 0;
    color: var(--text-2);
  }
  .empty-icon {
    width: 56px; height: 56px; border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), #6d28d9);
    display: grid; place-items: center;
    margin-bottom: 16px;
    box-shadow: 0 8px 24px rgba(139,92,246,.25);
  }
  .empty-icon svg { width: 28px; height: 28px; color: #fff; }
  .empty h2 {
    font-size: 17px; font-weight: 600; color: var(--text-1);
    margin-bottom: 8px; letter-spacing: -0.01em;
  }
  .empty p { font-size: 13px; color: var(--text-3); max-width: 320px; }
  .examples {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    margin-top: 22px;
  }
  .ex-chip {
    background: var(--bg-2); border: 1px solid var(--border-1);
    color: var(--text-2); padding: 6px 12px; border-radius: 999px;
    font-size: 12px; cursor: pointer;
    transition: all .12s;
  }
  .ex-chip:hover {
    border-color: var(--accent); color: var(--text-1);
    background: var(--bg-3);
  }

  /* ── Rich markdown inside AI bubbles ─────────────────── */
  .bubble h1, .bubble h2, .bubble h3, .bubble h4 {
    line-height: 1.3; font-weight: 600; color: var(--text-1);
    margin: 12px 0 6px; letter-spacing: -.01em;
  }
  .bubble h1:first-child, .bubble h2:first-child,
  .bubble h3:first-child, .bubble h4:first-child { margin-top: 0; }
  .bubble h1 { font-size: 17px; }
  .bubble h2 { font-size: 15.5px; }
  .bubble h3 { font-size: 14px; }
  .bubble h4 { font-size: 13px; color: var(--text-2); }
  .bubble p  { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 20px; }
  .bubble li { margin: 2px 0; }
  .bubble li::marker { color: var(--accent-hi); }
  .bubble a { color: var(--accent-hi); text-decoration: underline; text-underline-offset: 2px; }
  .bubble a:hover { color: var(--text-1); }
  .bubble blockquote {
    margin: 6px 0; padding: 2px 0 2px 12px;
    border-left: 3px solid var(--border-acc); color: var(--text-2);
  }
  .bubble hr { border: 0; border-top: 1px solid var(--border-1); margin: 12px 0; }
  .bubble table {
    border-collapse: collapse; margin: 8px 0; width: 100%;
    font-size: 12.5px; display: block; overflow-x: auto;
  }
  .bubble th, .bubble td { border: 1px solid var(--border-1); padding: 5px 9px; text-align: left; }
  .bubble th { background: var(--bg-2); font-weight: 600; color: var(--text-1); }

  /* ── Code block: language bar + per-block copy ───────── */
  .code-wrap {
    margin: 8px 0; border: 1px solid var(--border-1);
    border-radius: var(--radius-sm); overflow: hidden; background: var(--bg-0);
  }
  .code-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 3px 6px 3px 10px; background: var(--bg-2);
    border-bottom: 1px solid var(--border-1);
  }
  .code-lang {
    font-size: 10.5px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--text-3);
    font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  .code-lang::before { content: attr(data-lang); }
  .code-copy {
    display: flex; align-items: center; justify-content: center;
    width: 24px; height: 22px; padding: 0; border: 0; border-radius: 4px;
    background: transparent; color: var(--text-3); cursor: pointer;
    transition: background 120ms, color 120ms;
  }
  .code-copy:hover { background: var(--bg-3); color: var(--text-1); }
  .code-copy svg { width: 13px; height: 13px; }
  .code-wrap pre { margin: 0; border: 0; border-radius: 0; }

  /* ── Streaming caret ─────────────────────────────────── */
  .bubble.ai.streaming::after {
    content: "▋"; display: inline-block; margin-left: 1px;
    color: var(--accent-hi); font-size: 12px; line-height: 1;
    animation: caret-blink 1s steps(1) infinite;
  }
  @keyframes caret-blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }

  /* ── Jump-to-latest button ───────────────────────────── */
  #scrollBtn {
    position: fixed; right: 18px; bottom: 88px;
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--bg-3); border: 1px solid var(--border-2);
    color: var(--text-1); cursor: pointer; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-md);
    opacity: 0; transform: translateY(6px); pointer-events: none;
    transition: opacity 150ms ease, transform 150ms ease;
  }
  #scrollBtn.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  #scrollBtn:hover { background: var(--border-acc); }
  #scrollBtn svg { width: 18px; height: 18px; }
</style>
</head>
<body>

    </div>

    </div>
  </div>

  <span class="ctx-proj" id="ctxProj"></span><span class="ctx-sep" id="ctxSep"></span><span class="label">in focus:</span><code id="ctxFile"></code><span class="ctx-scope">· full project in context</span>

  <div id="empty" class="empty">

      </svg>

        <rect x="6" y="6" width="12" height="12" rx="3"/>
      </svg>

<script>
"use strict";

const params      = new URLSearchParams(location.search);
const backendHost = params.get("backend") || "localhost:8765";
const wsUrl       = "ws://" + backendHost + "/ws/chat";
const httpBase    = "http://" + backendHost;
let projectPath = decodeURIComponent(params.get("project")   || "");
let schematic   = decodeURIComponent(params.get("schematic") || "");
let pcbFile     = decodeURIComponent(params.get("pcb")       || "");

// Page-scope auto-detect. The same chat.html is shipped into both the
// eeschema and pcbnew resource trees; we figure out which editor is
// hosting the panel by inspecting the URL path KiCad loaded us from.
// Priority order:
//   1) explicit ?app= query param  (lets a dev override during testing)
//   2) window.KICAD_APP global     (if a future KiCad build injects one)
//   3) pathname containing "pcbnew" or "eeschema"
//   4) fallback ""                 (server treats as unscoped / legacy)
let appCtx = (params.get("app") || "").toLowerCase();
if (!appCtx && typeof window.KICAD_APP === "string") {
  appCtx = window.KICAD_APP.toLowerCase();
}
if (!appCtx) {
  const pn = (location.pathname || "").toLowerCase();
  if (pn.includes("pcbnew"))        appCtx = "pcb";
  else if (pn.includes("eeschema")) appCtx = "schematic";
}
// URL-param heuristic — works even on KiCad builds that don't pass
// `?app=` yet. eeschema's chat URL has `?...&schematic=<path>`; pcbnew's
// doesn't (it currently passes no file path). So if we still don't know
// the app, presence of `schematic=` says eeschema, presence of `pcb=`
// says pcbnew. Absence of BOTH → assume pcbnew because that's the only
// editor whose C++ side passes no file params.
if (!appCtx) {
  if (params.has("schematic")) appCtx = "schematic";
  else if (params.has("pcb"))  appCtx = "pcb";
  else                         appCtx = "pcb";
}
// Normalise aliases so the rest of this file uses one of two values.
if (appCtx === "pcbnew" || appCtx === "board") appCtx = "pcb";
if (appCtx === "sch" || appCtx === "eeschema") appCtx = "schematic";

// Derive the sibling file when only one path is known — KiCad projects
// keep matching basenames for .kicad_sch and .kicad_pcb. This is the
// same convention ship_design.py uses on the backend.
function deriveSiblingFile() {
  if (schematic && !pcbFile) {
    pcbFile = schematic.replace(/\.kicad_sch$/i, ".kicad_pcb");
  }
  if (pcbFile && !schematic) {
    schematic = pcbFile.replace(/\.kicad_pcb$/i, ".kicad_sch");
  }
}
deriveSiblingFile();

// Called by the eeschema C++ side after every project / schematic open so the
// chat panel always knows the live filename. Without this the URL params are
// frozen to whatever Schematic().GetFileName() returned at panel-construction
// time (= "untitled.kicad_sch" before any file is loaded), and both the
// "Editing X" display AND the schematic_file sent to the Python backend would
// be stuck on that stale value.
window.envilSetSchematic = function (newProject, newSchematic) {
  if (newProject)   projectPath = newProject;
  if (newSchematic) schematic   = newSchematic;
  // C++ calling envilSetSchematic == this panel lives in eeschema.
  // URL-path detection (location.pathname) is unreliable because KiCad
  // loads chat.html from the shared share/kicad/ai_chat/ folder for
  // both editors. This setter (and envilSetPcb below) is the authoritative
  // app-context signal.
  appCtx = "schematic";
  deriveSiblingFile();
  showCtxFile(schematic);
  // Re-hello so the Python server's room.attach_schematic gets the new path.
  if (ws && ws.readyState === WebSocket.OPEN) {
    send({ kind: "hello", project_path: projectPath,
           schematic_file: schematic, pcb_file: pcbFile, app: appCtx });
  }
};

// Symmetric setter the pcbnew C++ side can call after every board open.
// Mirrors envilSetSchematic. KiCad's pcbnew panel-launch code should
// invoke this so the chat tracks the live .kicad_pcb path the same way
// the schematic panel tracks .kicad_sch.
window.envilSetPcb = function (newProject, newPcb) {
  if (newProject) projectPath = newProject;
  if (newPcb)     pcbFile     = newPcb;
  // C++ calling envilSetPcb == this panel lives in pcbnew. See the
  // envilSetSchematic comment above for why this setter is the
  // authoritative signal (URL pathname is the same for both editors).
  appCtx = "pcb";
  deriveSiblingFile();
  showCtxFile(pcbFile || schematic);
  if (ws && ws.readyState === WebSocket.OPEN) {
    send({ kind: "hello", project_path: projectPath,
           schematic_file: schematic, pcb_file: pcbFile, app: appCtx });
  }
};

let ws = null;
let sessionId = localStorage.getItem("envil_session_id") || null;
let currentStream = null;
let currentBuf = "";
// Live "Thinking" panel for the current turn (collapsible reasoning, Claude
// style). Null until the first `thinking` event of a turn arrives.
let currentThink = null;     // the .think-panel element
let currentThinkBody = null; // its scrollable body
let currentThinkBuf = "";    // accumulated reasoning text
let thinkStartMs = 0;        // for the "Thought for Ns" label on collapse
let reconnectMs = 1000;
let reconnectTimer = null;
let keepalive = null;
const pending = [];

const $       = (id) => document.getElementById(id);
const msgsEl  = $("messages");
const emptyEl = $("empty");
const dotEl   = $("dot");
const stxtEl  = $("statusText");
const ctxBar  = $("ctxBar");
const ctxFile = $("ctxFile");
const ctxProj = $("ctxProj");
const ctxSep  = $("ctxSep");
const inputEl = $("input");
const thinkEl = $("thinking");
const thinkLabelEl = $("thinkLabel");
const THINK_LABELS = ["Analyzing", "Designing", "Processing"];
let thinkTimer = null;
const pendEl  = $("pending");
const scrollBtnEl = $("scrollBtn");
// Auto-scroll only sticks to the bottom while the user is already there. If they
// scroll up to read mid-stream, new tokens no longer yank them down (a 2026 chat
// UX baseline). Reset to true whenever the user sends or hits the jump button.
let stickToBottom = true;
// True only while a real model turn is in flight (a prompt was sent and we're
// awaiting the reply). Gates the "working" spinner so New Chat and bare status
// acks never trigger it without a prompt — matches Cursor/Claude, where the
// thinking indicator appears only after you submit a prompt. See send() and the
// "status" handler in handleSrv().
let turnActive = false;

const SVG_USER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
// AI avatar: Envil "A" logo image instead of the robot SVG
const SVG_AI   = '<img src="anvil_logo.png" alt="A" style="width:18px;height:18px;object-fit:contain;display:block;">';
// Proper inline-SVG copy / check icons for the per-message copy button (the old
// unicode clipboard glyph rendered as tofu in WebView2).
const SVG_COPY  = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>';
const SVG_CHECK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

function setStatus(state, text) { dotEl.className = "dot " + state; stxtEl.textContent = text; }

function showCtxFile(path) {
  if (!path) { ctxBar.classList.remove("active"); return; }
  ctxFile.textContent = path.split(/[\\/]/).pop();
  // Project name = the folder the design lives in (or the .kicad_pro stem).
  // Shows "<project> / in focus: <file> · full project in context" so it reads
  // as whole-project awareness, not a single-file lock.
  let proj = "";
  if (projectPath) {
    proj = String(projectPath).replace(/[\\/]+$/, "").split(/[\\/]/).pop() || "";
  }
  if (proj && ctxProj) { ctxProj.textContent = proj; if (ctxSep) ctxSep.textContent = "/"; }
  else { if (ctxProj) ctxProj.textContent = ""; if (ctxSep) ctxSep.textContent = ""; }
  ctxBar.classList.add("active");
}

function hideEmpty() { if (emptyEl) emptyEl.style.display = "none"; }
function nearBottom() {
  return msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 80;
}
function updateScrollBtn() {
  if (scrollBtnEl) scrollBtnEl.classList.toggle("show", !nearBottom());
}
function scroll() {
  if (stickToBottom) msgsEl.scrollTop = msgsEl.scrollHeight;
  updateScrollBtn();
}
function jumpToBottom() {
  stickToBottom = true;
  msgsEl.scrollTop = msgsEl.scrollHeight;
  updateScrollBtn();
}
msgsEl.addEventListener("scroll", () => { stickToBottom = nearBottom(); updateScrollBtn(); });
if (scrollBtnEl) scrollBtnEl.onclick = jumpToBottom;

// Shared clipboard helper (message copy button + per-code-block copy button),
// with an execCommand fallback for WebView2 builds without the async API.
function copyText(text, onDone) {
  const fb = () => {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); onDone && onDone(); } catch (_) {}
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(() => onDone && onDone()).catch(fb);
  else fb();
}
function showThinking(on) {
  // Show stop button while AI is generating, send button when idle.
  if (typeof setBusy === "function") setBusy(!!on);
  thinkEl.classList.toggle("active", !!on);
  if (thinkTimer) { clearInterval(thinkTimer); thinkTimer = null; }
  if (on) {
    let i = 0;
    thinkLabelEl.textContent = THINK_LABELS[0];
    thinkTimer = setInterval(() => {
      i = (i + 1) % THINK_LABELS.length;
      thinkLabelEl.textContent = THINK_LABELS[i];
    }, 1500);
    scroll();
  }
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
// Inline markdown (links, bold, italic, inline code) applied to already-
// HTML-escaped text. Inline code runs first so * / _ inside a code span are
// left alone.
function renderInline(s) {
  s = s.replace(/`([^`\n]+)`/g, (_, c) => "<code>" + c + "</code>");
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
  s = s.replace(/(^|[^_\w])_([^_\n]+)_(?![_\w])/g, "$1<em>$2</em>");
  // Links — only http(s) or root-relative targets (URL is already escaped).
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|\/[^\s)]+)\)/g,
    (_, t, u) => '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + t + '</a>');
  return s;
}

// Markdown -> safe HTML. Fenced code is pulled out to placeholders first so the
// block/inline passes never touch it, then restored as <pre data-lang><code>.
// Adds headings, ordered/unordered lists, blockquotes, tables and rules on top
// of the original bold / inline-code / bullet support.
function renderMd(text) {
  let s = escHtml(text);

  // Progressive streaming: an unclosed fence (odd ``` count) is closed for this
  // render so the in-progress block shows as code, not raw backticks.
  if (((s.match(/```/g) || []).length) % 2 === 1) s += "\n```";

  const blocks = [];
  s = s.replace(/```([\w-]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    blocks.push({ lang: (lang || "").trim(), code: code.replace(/\n+$/, "") });
    return "C" + (blocks.length - 1) + "";
  });

  const out = [];
  let list = null;     // { type:"ul"|"ol", items:[] }
  let table = null;    // array of cell-arrays
  let para = [];
  const flushPara  = () => { if (para.length) { out.push("<p>" + renderInline(para.join("<br>")) + "</p>"); para = []; } };
  const flushList  = () => { if (list) { out.push("<" + list.type + ">" + list.items.map(i => "<li>" + renderInline(i) + "</li>").join("") + "</" + list.type + ">"); list = null; } };
  const flushTable = () => {
    if (table && table.length) {
      let h = "<table><thead><tr>" + table[0].map(c => "<th>" + renderInline(c.trim()) + "</th>").join("") + "</tr></thead><tbody>";
      for (let r = 2; r < table.length; r++) h += "<tr>" + table[r].map(c => "<td>" + renderInline(c.trim()) + "</td>").join("") + "</tr>";
      out.push(h + "</tbody></table>");
      table = null;
    }
  };
  const flushAll = () => { flushPara(); flushList(); flushTable(); };

  for (const line of s.split("\n")) {
    if (/^C\d+$/.test(line)) { flushAll(); out.push(line); continue; }
    if (/^\s*\|.*\|\s*$/.test(line)) {                       // table row
      flushPara(); flushList();
      (table = table || []).push(line.trim().replace(/^\||\|$/g, "").split("|"));
      continue;
    }
    if (table) flushTable();
    let m = line.match(/^\s*(#{1,4})\s+(.*)$/);              // heading
    if (m) { flushAll(); const n = m[1].length; out.push("<h" + n + ">" + renderInline(m[2].trim()) + "</h" + n + ">"); continue; }
    if (/^\s*([-*_])\1\1+\s*$/.test(line)) { flushAll(); out.push("<hr>"); continue; }   // rule
    m = line.match(/^\s*>\s?(.*)$/);                         // blockquote
    if (m) { flushPara(); flushList(); out.push("<blockquote>" + renderInline(m[1]) + "</blockquote>"); continue; }
    m = line.match(/^\s*\d+[.)]\s+(.*)$/);                   // ordered item
    if (m) { flushPara(); if (list && list.type !== "ol") flushList(); (list = list || { type: "ol", items: [] }).items.push(m[1]); continue; }
    m = line.match(/^\s*[-*]\s+(.*)$/);                      // unordered item
    if (m) { flushPara(); if (list && list.type !== "ul") flushList(); (list = list || { type: "ul", items: [] }).items.push(m[1]); continue; }
    if (/^\s*$/.test(line)) { flushPara(); flushList(); continue; }   // blank line
    flushList();
    para.push(line);
  }
  flushAll();

  let html = out.join("\n");
  html = html.replace(/C(\d+)/g, (_, i) => {
    const b = blocks[+i];
    return "<pre" + (b.lang ? ' data-lang="' + b.lang + '"' : "") + "><code>" + b.code + "</code></pre>";
  });
  return html;
}

// Add a header bar (language label + copy button) to each code block in a
// rendered bubble. Idempotent via a data-flag so re-renders never double-wrap.
function decorateCodeBlocks(container) {
  container.querySelectorAll("pre").forEach(pre => {
    if (pre.dataset.decorated) return;
    pre.dataset.decorated = "1";
    const code = pre.querySelector("code");
    const bar = document.createElement("div");
    bar.className = "code-bar";
    const label = document.createElement("span");
    label.className = "code-lang";
    // data-lang via CSS ::before so the label never lands in the message-copy text.
    label.setAttribute("data-lang", pre.getAttribute("data-lang") || "code");
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "code-copy"; btn.title = "Copy code";
    btn.innerHTML = SVG_COPY;
    btn.addEventListener("click", () => copyText(code ? code.innerText : pre.innerText,
      () => { btn.innerHTML = SVG_CHECK; setTimeout(() => { btn.innerHTML = SVG_COPY; }, 900); }));
    bar.appendChild(label); bar.appendChild(btn);
    const wrap = document.createElement("div");
    wrap.className = "code-wrap";
    pre.parentNode.insertBefore(wrap, pre);
    wrap.appendChild(bar);
    wrap.appendChild(pre);
  });
}

// SVG icons for the action row
const SVG_ACT_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg>';
const SVG_ACT_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

function makeActBtn(icon, title) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "act-btn"; b.title = title;
  b.innerHTML = icon;
  return b;
}

function addRow(role, html) {
  hideEmpty();
  const row = document.createElement("div");
  row.className = "row " + role;
  row.addEventListener("mouseenter", () => row.classList.add("hov"));
  row.addEventListener("mouseleave", () => row.classList.remove("hov"));

  const av = document.createElement("div");
  av.className = "avatar " + role;
  av.innerHTML = role === "ai" ? SVG_AI : SVG_USER;

  // Bubble + action-row live in a flex-column wrapper so the action row
  // sits flush below the bubble (Claude / ChatGPT style).
  // flex:1 + min-width:0 lets the bubble use available space without double-
  // constraining (the bubble's own max-width handles capping).
  const col = document.createElement("div");
  col.style.cssText = "display:flex;flex-direction:column;flex:1;min-width:0;";

  const bub = document.createElement("div");
  bub.className = "bubble " + role;
  bub.innerHTML = html;

  const actions = buildActionRow(bub);

  col.appendChild(bub);
  col.appendChild(actions);
  row.appendChild(av);
  row.appendChild(col);
  msgsEl.appendChild(row);
  scroll();
  return bub;
}

// Returns the action row div; also stores a ref on bub so streaming can refresh it.
function buildActionRow(bub) {
  const actions = document.createElement("div");
  actions.className = "msg-actions";

  const copyBtn = makeActBtn(SVG_ACT_COPY, "Copy message");
  copyBtn.addEventListener("click", () => {
    const text = bub.innerText.trim();
    copyText(text, () => {
      copyBtn.innerHTML = SVG_ACT_CHECK;
      copyBtn.classList.add("copied");
      setTimeout(() => {
        copyBtn.innerHTML = SVG_ACT_COPY;
        copyBtn.classList.remove("copied");
      }, 1200);
    });
  });

  actions.appendChild(copyBtn);
  bub._actionRow = actions;   // ref so streaming re-uses same row
  return actions;
}

// Called after streaming finalises innerHTML — re-wires the copy button
// (streaming resets innerHTML, which drops any previously appended child).
function attachCopyButton(bub) {
  if (bub._actionRow) {
    // Action row already exists below the bubble (added by addRow).
    // Nothing to do — the copy button is already wired.
    return;
  }
  // Fallback: streaming added a bubble directly without going through addRow.
  const col = bub.parentElement;
  if (col) {
    const actions = buildActionRow(bub);
    col.appendChild(actions);
  }
}

function addSystem(text) {
  hideEmpty();
  const el = document.createElement("div");
  el.className = "system-msg";
  el.textContent = text;
  msgsEl.appendChild(el);
  scroll();
}
function addError(text) {
  hideEmpty();
  const el = document.createElement("div");
  el.className = "error-msg";
  el.textContent = text;
  msgsEl.appendChild(el);

}

// Replace any prior auto-summary card so opening a different file doesn't pile
// stacks of them up in the conversation. Identifiable by data-envil-summary.
const READINESS_BADGE = {
  ready:        { label: "Production ready",  cls: "ok",   icon: "✓" },
  minor_polish: { label: "Minor polish needed", cls: "info", icon: "•" },
  needs_review: { label: "Needs review",      cls: "warn", icon: "!" },
  not_ready:    { label: "Not ready for production", cls: "err", icon: "✕" },
};
const SEV_META = {
  critical: { label: "Critical", cls: "es-sev-crit", order: 0 },
  high:     { label: "High",     cls: "es-sev-high", order: 1 },
  medium:   { label: "Medium",   cls: "es-sev-med",  order: 2 },
};

function renderSchematicSummary(m) {
  document.querySelectorAll('[data-envil-summary]').forEach(n => n.remove());
  const issues = m.issues || [];
  const circuit = (m.circuit || "").trim();
  // Render NOTHING when nothing useful to show: no detected circuit AND no
  // critical/high/medium issues. Silence is the success signal.
  if (!circuit && !issues.length) return;
  hideEmpty();
  const el = document.createElement("div");
  el.className = "envil-summary";
  el.setAttribute("data-envil-summary", "1");

  // Group by severity → category.
  const bySev = { critical: [], high: [], medium: [] };
  for (const it of issues) {
    if (bySev[it.severity]) bySev[it.severity].push(it);
  }

  let html = "";
  if (circuit) {
    html += '<div class="es-circuit">' + escHtml(circuit) + '</div>';
  }
  const sevOrder = ["critical", "high", "medium"];
  for (const sev of sevOrder) {
    const list = bySev[sev];
    if (!list || !list.length) continue;
    const meta = SEV_META[sev];
    const byCat = {};
    for (const it of list) (byCat[it.category] || (byCat[it.category] = [])).push(it);
    const cats = Object.keys(byCat).sort();
    html += '<details class="es-sev ' + meta.cls + '" open>';
    html +=   '<summary><span class="es-sev-dot"></span><span class="es-sev-name">' + meta.label + '</span><span class="es-sev-num">' + list.length + '</span></summary>';
    for (const cat of cats) {
      html += '<div class="es-cat">' + escHtml(cat) + '</div>';
      html += '<ul class="es-items">';
      for (const it of byCat[cat]) {
        const ref = it.refs ? '<span class="es-ref">' + escHtml(it.refs) + '</span>' : "";
        html += '<li>' + ref + '<span class="es-title">' + escHtml(it.title) + '</span></li>';
      }
      html += '</ul>';
    }
    html += '</details>';
  }

  el.innerHTML = html;
  msgsEl.appendChild(el);
  scroll();
}

function addUserRow(text, attachments) {
  stickToBottom = true;   // sending always jumps you to the latest message
  const bub = addRow("user", escHtml(text));
  for (const a of (attachments || [])) {
    const div = document.createElement("div");
    div.className = "attachment" + (a.kind === "image" ? " image" : "");
    if (a.kind === "image" && a.dataUrl) {
      const img = document.createElement("img");
      img.src = a.dataUrl;
      div.appendChild(img);
    } else {
      const icon = a.kind === "pdf"        ? "📄  "
                 : a.kind === "erc_report"  ? "📝  "
                 :                            "📎  ";
      div.textContent = icon + a.name;
    }
    bub.appendChild(div);
  }
  return bub;
}

// Native transport: messages go to the C++ host over the wxWebView bridge
// (window.envilSend.postMessage) instead of a WebSocket to a Python backend.
// The C++ side pushes server messages back by calling window.appendServerMessage().
function send(obj) {
  obj.session_id = sessionId;
  if (obj.kind === "message" || obj.kind === "export_gerbers") turnActive = true;
  else if (obj.kind === "reset") turnActive = false;
  try {
    window.envilSend.postMessage(JSON.stringify(obj));
  } catch (e) {
    console.error("[envil] bridge send failed", e);
    return false;
  }
  return true;
}

function connect() {
  // Native agent lives in-process; treat as always connected.
  setStatus("connected", "Native");
  send({ kind: "hello", project_path: projectPath,
         schematic_file: schematic, pcb_file: pcbFile, app: appCtx });
  showCtxFile(appCtx === "pcb" ? (pcbFile || schematic) : schematic);
}

function scheduleReconnect() { /* native transport: no reconnect needed */ }

function handleSrv(m) {
  if (m.session_id) {
    sessionId = m.session_id;
    localStorage.setItem("envil_session_id", sessionId);
  }
  switch (m.kind) {
    case "ready":   return;
    case "pong":    return;
    case "status":
      // Only spin while a turn is actually in flight. Bare status acks (e.g.
      // "Conversation reset." after New Chat, "Opened the folder.") must NOT
      // show the thinking indicator without a prompt — matches Cursor/Claude.
      if (turnActive) showThinking(true);
      return;
    case "thinking":
      // Streamed reasoning -> live collapsible panel (created lazily).
      appendThinking(m.text || "");
      return;
    case "chunk":
      showThinking(false);
      appendStream(m.text || "");
      return;
    case "reply":
      turnActive = false;
      showThinking(false);
      collapseThink();
      finalizeStream(m.text);
      if (m.action_id && Array.isArray(m.ops) && m.ops.length) renderApproval(m);
      return;
    case "applied":
      showThinking(false);
      addSystem("✓ Applied " + (m.count ?? 0) + "/" + (m.total ?? m.count ?? 0) + " operations"
        + (m.file_path ? " → " + m.file_path.split(/[\\/]/).pop() : ""));
      // Surface per-op warnings (e.g. fuzzy lib_id substitutions) and missing-library
      // errors so the user knows when the AI couldn't find a symbol exactly.
      for (const r of (m.results || [])) {
        if (r.needs_user || (r.ok === false && r.lib_id)) {
          addError("❗ " + (r.message || r.op || "missing library"));
        } else if (r.warning) {
          addSystem("⚠ " + r.warning);
        }
      }
      return;
    case "schematic_summary":
      renderSchematicSummary(m);
      return;
    case "page_summary":
      // Server-side deterministic page-summary card emitted right
      // after `hello`. Tells the user what's on the page they just
      // opened on (schematic or PCB) and offers click-to-send
      // suggestion chips so they can start without typing.
      renderPageSummary(m);
      return;
    case "previews":
      // Inline schematic preview disabled per user request — server still
      // generates the SVG (used for ERC/visual analysis) but the chat UI
      // no longer embeds it.
      return;
    case "confirm_buttons":
      // Generic 3-button confirmation strip for the "Allow / Cancel /
      // Ask for change?" preview flow. Each option carries a label and
      // either a `send` text (auto-reply) or an `ask:true` flag (focus
      // input box for free-form reply).
      renderConfirmButtons(m.options || []);
      return;
    case "gerbers_ready":
      // Fab bundle is on disk. Show a card with an "Open Folder" button so
      // the user can grab the zip and upload it to the factory.
      turnActive = false;
      showThinking(false);
      renderGerbersReady(m);
      return;
    case "error":
      turnActive = false;
      showThinking(false);
      collapseThink();
      addError(m.text || "Unknown error");
      return;
    default:
      console.warn("[envil] unhandled", m.kind, m);
  }
}

function renderPreviews(svgPaths) {
  if (!Array.isArray(svgPaths) || svgPaths.length === 0) return;
  const last = msgsEl.lastElementChild;
  let target;
  if (last && last.classList.contains("row") && last.classList.contains("ai")) {
    target = last.querySelector(".bubble") || addRow("ai", "");

  }

  grid.className = "preview-grid";

    const caption = document.createElement("div");

function renderPageSummary(m) {
  // m: { kind:"page_summary", app, state, title, body, suggestions[],
  //      stats? }. Render once at the top of the conversation as an
  // AI bubble so the user knows what is currently on the open file
  // without typing anything. Suggestion chips re-use the same send()
  // pipeline as typed messages — clicking a chip is equivalent to
  // typing the suggestion and pressing Enter.
  const title  = m.title || (m.app === "pcb" ? "PCB" : "Schematic");
  const body   = m.body  || "";
  const sugg   = Array.isArray(m.suggestions) ? m.suggestions : [];
  const scope  = (m.app === "pcb") ? "PCB Editor"
               : (m.app === "schematic") ? "Schematic Editor"
               : "Editor";

  const target = addRow("ai", "");
  // Title line. No `color:` override so the green inherits from the
  // CSS variable / theme and the title text doesn't get clipped by
  // the bubble's dark/light theme. Green-only for the accent.
  const titleEl = document.createElement("div");
  titleEl.style.cssText =
    "font-weight:600;font-size:13px;margin-bottom:4px;color:#3ec97a;";
  titleEl.textContent = `${scope} — ${title}`;
  target.appendChild(titleEl);
  // Body line — use renderMd (XSS-safe: escapes HTML first, then
  // converts **bold** / `code` / ```pre```). The deep summary template
  // uses **bold** to highlight the circuit type; without renderMd
  // it would show literal ** characters.
  // No `color:` override here — body inherits the bubble's text color
  // so the card stays readable on both dark and light themes. The
  // earlier `color:#222` was invisible on the default dark panel.
  if (body) {
    const bodyEl = document.createElement("div");
    bodyEl.style.cssText = "font-size:13px;line-height:1.45;";
    bodyEl.innerHTML = renderMd(body);
    target.appendChild(bodyEl);
  }
  // "Open PCB" button — jumps the app to the PCB page. The board is generated
  // at build time (pcb_gen writes the .kicad_pcb with footprints placed + nets),
  // so this just asks the backend to open it: kind:"open_pcb" -> IPC -> eeschema
  // OnOpenPcbnew() opens/docks the PCB editor as a tab. Hidden when already on
  // the PCB page (nothing to switch to).
  if (m.app !== "pcb") {
    const pcbRow = document.createElement("div");
    pcbRow.style.cssText = "margin-top:8px;";
    const openBtn = document.createElement("button");
    openBtn.textContent = "Open PCB";
    openBtn.className = "btn primary";
    openBtn.style.cssText =
      "background:#3ec97a;color:#0b1f14;border:none;padding:5px 14px;"
      + "border-radius:14px;cursor:pointer;font-size:12px;font-weight:600;";
    openBtn.onclick = () => {
      openBtn.disabled = true;
      openBtn.style.opacity = "0.7";
      openBtn.textContent = "Opening PCB…";
      send({
        kind: "open_pcb",
        project_path: projectPath,
        schematic_file: schematic,
        pcb_file: pcbFile,
        app: appCtx,
      });
    };
    pcbRow.appendChild(openBtn);
    target.appendChild(pcbRow);
  } else {
    // Already on the PCB page — offer the one-click fab export instead.
    // Makes Gerbers + drill + pick&place + zip without the KiCad menus.
    const gRow = document.createElement("div");
    gRow.style.cssText = "margin-top:8px;";
    gRow.appendChild(makeGerbersButton("⬇ Download Gerbers"));
    target.appendChild(gRow);
  }

  // Suggestion chips
  if (sugg.length) {
    const hint = document.createElement("div");
    hint.style.cssText =
      "font-size:11px;opacity:0.7;margin-top:8px;margin-bottom:4px;";
    hint.textContent = "Try one of these:";
    target.appendChild(hint);
    const row = document.createElement("div");
    row.style.cssText =
      "display:flex;gap:6px;margin-top:2px;flex-wrap:wrap;";
    const buttons = [];
    for (const s of sugg) {
      const btn = document.createElement("button");
      btn.textContent = s;
      btn.className = "btn secondary";
      btn.style.cssText =
        "background:#eef3ff;color:#1c3d8c;border:1px solid #c7d4f3;"
        + "padding:4px 10px;border-radius:14px;cursor:pointer;font-size:12px;";
      btn.onclick = () => {
        for (const b of buttons) b.disabled = true;
        btn.style.opacity = "0.7";
        addUserRow(s, []);
        showThinking(true);
        send({
          kind: "message",
          text: s,
          project_path: projectPath,
          schematic_file: schematic,
          pcb_file: pcbFile,
          app: appCtx,
          attachments: [],
        });
      };
      buttons.push(btn);
      row.appendChild(btn);
    }
    target.appendChild(row);
  }
  scroll();
}

function renderConfirmButtons(options) {
  if (!Array.isArray(options) || options.length === 0) return;
  const last = msgsEl.lastElementChild;
  let target;
  if (last && last.classList.contains("row") && last.classList.contains("ai")) {
    target = last.querySelector(".bubble") || addRow("ai", "");
  } else {
    target = addRow("ai", "");
  }
  const row = document.createElement("div");
  row.className = "btn-row confirm-row";
  row.style.cssText = "display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;";
  const buttons = [];
  for (const opt of options) {
    const btn = document.createElement("button");
    btn.textContent = opt.label || "?";
    btn.className = "btn " + (opt.primary ? "primary" : "secondary");
    btn.style.cssText = opt.primary
      ? "background:#0e7c3a;color:#fff;border:0;padding:6px 14px;border-radius:4px;cursor:pointer;"
      : "background:#e8e8e8;color:#333;border:1px solid #ccc;padding:6px 14px;border-radius:4px;cursor:pointer;";
    btn.onclick = () => {
      // Single-shot: disable all sibling buttons on click
      for (const b of buttons) b.disabled = true;
      btn.style.opacity = "0.7";
      if (opt.ask) {
        // Focus the input so user can type a free-form change request.
        if (typeof inputEl !== "undefined" && inputEl) {
          inputEl.focus();
        }
        return;
      }
      const txt = (opt.send || "").trim();
      if (!txt) return;
      // Echo as a user message so the conversation reads naturally,
      // then send via the same path /ws/chat uses for typed input.
      addUserRow(txt, []);
      showThinking(true);
      send({
        kind: "message",
        text: txt,
        project_path: projectPath,
        schematic_file: schematic,
        pcb_file: pcbFile,
        app: appCtx,
        attachments: [],
      });
    };
    buttons.push(btn);
    row.appendChild(btn);
  }
  target.appendChild(row);
  scroll();
}

// --- Gerbers / fab bundle --------------------------------------------------
