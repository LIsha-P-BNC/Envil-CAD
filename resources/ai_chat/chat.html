// --- Thinking panel --------------------------------------------------------
// Streams the model's reasoning into one collapsible panel per turn. The panel
// is created lazily on the first `thinking` chunk, stays expanded + live while
// reasoning streams, and is collapsed to a "Thought for Ns" summary the moment
// the real reply text begins (collapseThink). Click the header to re-toggle.
const SVG_CHEVRON =
  '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
  + 'stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">'
  + '<polyline points="6 9 12 15 18 9"/></svg>';

function appendThinking(chunk) {
  if (!chunk) return;
  hideEmpty();
  if (!currentThink) {
    thinkStartMs = Date.now();
    currentThinkBuf = "";
    const panel = document.createElement("div");
    panel.className = "think-panel";
    const head = document.createElement("div");
    head.className = "tp-head";
    head.innerHTML =
      '<span class="tp-chevron">' + SVG_CHEVRON + '</span>'
      + '<span class="tp-label">Thinking</span>'
      + '<span class="tp-spark"></span>';
    head.onclick = () => panel.classList.toggle("collapsed");
    const body = document.createElement("div");
    body.className = "tp-body";
    panel.appendChild(head);
    panel.appendChild(body);
    msgsEl.appendChild(panel);
    currentThink = panel;
    currentThinkBody = body;
  }
  // The thinking spinner placeholder is now redundant — the live panel IS the
  // working indicator.
  showThinking(false);
  currentThinkBuf += chunk;
  currentThinkBody.textContent = currentThinkBuf;
  currentThinkBody.scrollTop = currentThinkBody.scrollHeight;
  scroll();
}

// Collapse the live panel into a "Thought for Ns" summary. Called when the
// real reply starts (or the turn ends) so the reasoning tucks away like
// Cursor/Claude. Idempotent and a no-op when no panel exists.
function collapseThink() {
  if (!currentThink) return;
  const secs = Math.max(1, Math.round((Date.now() - thinkStartMs) / 1000));
  const label = currentThink.querySelector(".tp-label");
  if (label) label.textContent = "Thought for " + secs + "s";
  currentThink.classList.add("done", "collapsed");
  // Detach from the live refs so the next turn starts a fresh panel but this
  // one stays in the transcript, re-expandable on click.
  currentThink = null;
  currentThinkBody = null;
  currentThinkBuf = "";
}

function appendStream(chunk) {
  // First real reply token -> tuck the reasoning panel away.
  if (currentThink) collapseThink();
  if (!currentStream) { currentStream = addRow("ai", ""); currentBuf = ""; }
  currentBuf += chunk;
  // Hide raw JSON envelope ({"message":..., "ops":[...]}) while streaming —
  // wait for the parsed `reply` to arrive and replace with clean message.
  const trimmed = currentBuf.trimStart();
  if (trimmed.startsWith("{") || trimmed.startsWith("```")) {
    showThinking(true);
    return;
  }
  currentStream.classList.add("streaming");   // blinking caret while tokens arrive
  currentStream.innerHTML = renderMd(currentBuf);
  scroll();
}

// --- Architecture card -----------------------------------------------------
// The Intake Brain's ARCHITECTURE_FIRST reply is structured plain text
// (a "**Architecture — <domain>**" title, "- Block: detail" bullets, an
// "Estimated:" line and a "Want me to build it?" prompt). Render it as a
// neat card instead of a bubble of bullets. Detection is conservative
// (title + >=2 bullets) so ordinary replies are never reshaped.
const ARCH_STYLE_ID = "arch-card-styles";
function ensureArchStyles() {
  if (document.getElementById(ARCH_STYLE_ID)) return;
  const st = document.createElement("style");
  st.id = ARCH_STYLE_ID;
  st.textContent =
    ".bubble.has-card{background:transparent;border:none;padding:0;box-shadow:none;}" +
    ".arch-card{background:var(--bg-2);border:1px solid var(--border-2);border-radius:var(--radius,10px);overflow:hidden;box-shadow:var(--shadow-md);}" +
    ".arch-head{display:flex;align-items:center;gap:9px;padding:10px 13px;background:linear-gradient(135deg,var(--accent-soft),transparent);border-bottom:1px solid var(--border-1);}" +
    ".arch-ico{width:22px;height:22px;flex:0 0 22px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:linear-gradient(135deg,var(--accent),#6d28d9);color:#0b0d12;font-size:13px;font-weight:700;}" +
    ".arch-title{font-weight:600;color:var(--text-1);font-size:13.5px;flex:1;letter-spacing:.1px;}" +
    ".arch-badge{font-size:11px;color:var(--accent-hi);background:var(--accent-soft);border:1px solid var(--border-acc);border-radius:999px;padding:2px 9px;white-space:nowrap;}" +
    ".arch-blocks{padding:4px 13px 6px;}" +
    ".arch-block{display:flex;gap:11px;padding:7px 0;border-bottom:1px dashed var(--border-1);}" +
    ".arch-block:last-child{border-bottom:none;}" +
    ".arch-bname{flex:0 0 96px;color:var(--accent-hi);font-weight:600;font-size:12.5px;}" +
    ".arch-bdesc{flex:1;color:var(--text-2);font-size:12.5px;line-height:1.45;}" +
    ".arch-foot{padding:9px 13px;border-top:1px solid var(--border-1);background:var(--bg-1);color:var(--text-1);font-size:12.5px;font-weight:500;}";
  document.head.appendChild(st);
}

function parseArchitecture(text) {
  const blocks = [];
  let domain = null, est = "", foot = "";
  for (const raw of String(text).split("\n")) {
    const ln = raw.trim();
    if (!ln) continue;
    let m;
    if (!domain && (m = ln.match(/^\*{0,2}\s*Architecture\s*[—\-–:]\s*(.+?)\s*\*{0,2}$/i))) {
      domain = m[1].replace(/\*+$/, "").trim(); continue;
    }
    if ((m = ln.match(/^[-*]\s+(.+)$/))) {
      const body = m[1].replace(/\*\*/g, "");
      const c = body.match(/^(.+?)\s*:\s*(.+)$/);
      blocks.push(c ? { name: c[1].trim(), desc: c[2].trim() } : { name: "", desc: body.trim() });
      continue;
    }
    if ((m = ln.match(/^Estimated\s*:\s*(.+)$/i))) { est = m[1].trim(); continue; }
    if (/build it\s*\?/i.test(ln)) { foot = ln.replace(/\*+/g, "").trim(); continue; }
  }
  return { domain, blocks, est, foot };
}

function looksLikeArchitecture(text) {
  if (!text || !/Architecture\s*[—\-–:]/i.test(text)) return false;
  const a = parseArchitecture(text);
  return !!a.domain && a.blocks.length >= 2;
}

function badgeFromEst(est) {
  if (!est) return "";
  const comp = est.match(/~?\s*(\d+)\s*comp/i);
  const sh = est.match(/(\d+)\s*sheet/i);
  if (comp && sh) return "~" + comp[1] + " parts · " + sh[1] + " sheets";
  if (comp) return "~" + comp[1] + " parts";
  return est;
}

function renderArchitectureCard(text) {
  ensureArchStyles();
  const a = parseArchitecture(text);
  let h = '<div class="arch-card"><div class="arch-head"><span class="arch-ico">▣</span>';
  h += '<span class="arch-title">' + escHtml(a.domain || "Architecture") + '</span>';
  const badge = badgeFromEst(a.est);
  if (badge) h += '<span class="arch-badge">' + escHtml(badge) + '</span>';
  h += '</div><div class="arch-blocks">';
  for (const b of a.blocks) {
    h += '<div class="arch-block">';
    if (b.name) h += '<span class="arch-bname">' + escHtml(b.name) + '</span>';
    h += '<span class="arch-bdesc">' + escHtml(b.desc) + '</span></div>';
  }
  h += '</div>';
  if (a.foot) h += '<div class="arch-foot">' + escHtml(a.foot) + '</div>';
  h += '</div>';
  return h;
}

// --- Clarify (intake) question card ---------------------------------------
// The Intake Brain's ASK_QUESTIONS reply is structured plain text: a short
// bold intro, then "- <Label>: <choice> / <choice> / ..." bullets. Render it
// as clickable option chips (single-select per question) with a Continue
// button so the user picks instead of typing. Detection mirrors the
// architecture card: conservative, only fires on the strict slash-option
// layout, and never on an architecture / confirm reply.
const CLR_STYLE_ID = "clarify-card-styles";
function ensureClarifyStyles() {
  if (document.getElementById(CLR_STYLE_ID)) return;
  const st = document.createElement("style");
  st.id = CLR_STYLE_ID;
  st.textContent =
    ".bubble.has-card{background:transparent;border:none;padding:0;box-shadow:none;}" +
    ".clr-card{background:var(--bg-2);border:1px solid var(--border-2);border-radius:var(--radius,10px);overflow:hidden;box-shadow:var(--shadow-md);}" +
    ".clr-head{display:flex;align-items:center;gap:9px;padding:10px 13px;background:linear-gradient(135deg,var(--accent-soft),transparent);border-bottom:1px solid var(--border-1);}" +
    ".clr-ico{width:22px;height:22px;flex:0 0 22px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:linear-gradient(135deg,var(--accent),#6d28d9);color:#0b0d12;font-size:14px;font-weight:700;}" +
    ".clr-title{font-weight:600;color:var(--text-1);font-size:13.5px;flex:1;letter-spacing:.1px;}" +
    ".clr-body{padding:8px 13px 2px;}" +
    ".clr-q{padding:6px 0 9px;border-bottom:1px dashed var(--border-1);}" +
    ".clr-q:last-child{border-bottom:none;}" +
    ".clr-qlabel{color:var(--text-2);font-size:12px;font-weight:600;margin-bottom:7px;}" +
    ".clr-opts{display:flex;flex-wrap:wrap;gap:6px;}" +
    ".clr-opt{cursor:pointer;font:inherit;font-size:12.5px;padding:5px 12px;border-radius:999px;background:var(--bg-3);color:var(--text-1);border:1px solid var(--border-2);transition:background .12s,border-color .12s,color .12s;}" +
    ".clr-opt:hover{border-color:var(--accent);background:var(--bg-1);}" +
    ".clr-opt.sel{background:var(--accent);color:#0b0d12;border-color:var(--accent);font-weight:600;}" +
    // Checkbox-style options (used for "package" questions: THT vs SMD).
    ".clr-checks{display:flex;flex-wrap:wrap;gap:6px;}" +
    ".clr-check{display:flex;align-items:center;gap:8px;cursor:pointer;font:inherit;font-size:12.5px;padding:6px 12px;border-radius:var(--radius-sm,6px);background:var(--bg-3);color:var(--text-1);border:1px solid var(--border-2);transition:background .12s,border-color .12s;}" +
    ".clr-check:hover{border-color:var(--accent);background:var(--bg-1);}" +
    ".clr-box{width:15px;height:15px;flex:0 0 15px;display:flex;align-items:center;justify-content:center;border-radius:4px;border:1.5px solid var(--border-2);background:var(--bg-1);color:#0b0d12;font-size:11px;font-weight:800;line-height:1;transition:background .12s,border-color .12s;}" +
    ".clr-check.sel{border-color:var(--accent);}" +
    ".clr-check.sel .clr-box{background:var(--accent);border-color:var(--accent);}" +
    ".clr-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 13px;border-top:1px solid var(--border-1);background:var(--bg-1);}" +
    ".clr-hint{font-size:11px;color:var(--text-3);}" +
    ".clr-go{border:0;cursor:pointer;font:inherit;font-weight:600;font-size:12.5px;padding:7px 16px;border-radius:var(--radius-sm,6px);background:var(--accent);color:#0b0d12;box-shadow:0 2px 8px rgba(139,92,246,.35);}" +
    ".clr-go:hover{background:var(--accent-hi);}" +
    ".clr-card.done{opacity:.6;pointer-events:none;}";
  document.head.appendChild(st);
}

function parseClarify(text) {
  let intro = "";
  const questions = [];
  for (const raw of String(text).split("\n")) {
    const ln = raw.trim();
    if (!ln) continue;
    let m;
    // First standalone **bold** (non-bullet) line is the intro.
    if (!intro && !/^[-*]\s/.test(ln) && (m = ln.match(/^\*\*(.+?)\*\*:?$/))) {
      intro = m[1].trim(); continue;
    }
    // "- Label: a / b / c" — only counts as a question when the value side
    // is a " / "-separated list of short choices.
    m = ln.match(/^[-*]\s+(.+?)\s*:\s*(.+?)\s*\??$/);
    if (m && m[2].includes("/")) {
      const label = m[1].replace(/\*\*/g, "").trim();
      const opts = m[2].replace(/\*\*/g, "").split("/")
        .map(s => s.trim()).filter(Boolean);
      if (opts.length >= 2 && opts.every(o => o.length > 0 && o.length <= 26)) {
        questions.push({ label, options: opts });
      }
    }
  }
  return { intro, questions };
}

function looksLikeClarify(text) {
  if (!text) return false;
  if (looksLikeArchitecture(text)) return false;
  if (/build it\s*\?|\ballow\b|\bcancel\b/i.test(text)) return false;
  return parseClarify(text).questions.length >= 1;
}

function renderClarifyInto(bubble, text) {
  ensureClarifyStyles();
  const data = parseClarify(text);
  bubble.classList.add("has-card");
  bubble.innerHTML = "";
  const card = document.createElement("div");
  card.className = "clr-card";

  const head = document.createElement("div");
  head.className = "clr-head";
  head.innerHTML = '<span class="clr-ico">?</span><span class="clr-title">'
    + escHtml(data.intro || "A few details first") + '</span>';
  card.appendChild(head);

  const body = document.createElement("div");
  body.className = "clr-body";
  const selected = new Array(data.questions.length).fill(null);
  data.questions.forEach((q, qi) => {
    const qd = document.createElement("div");
    qd.className = "clr-q";
    const lab = document.createElement("div");
    lab.className = "clr-qlabel";
    lab.textContent = q.label;
    qd.appendChild(lab);
    // Package questions (THT vs SMD) render as checkbox rows; every other
    // question keeps the pill-chip look. Both stay single-select and store a
    // single string in selected[qi], so the "Label: choice" text sent on
    // Continue is unchanged (the backend _detect_package_preference regex
    // still parses it).
    const isPackage = /\bpackage\b/i.test(q.label);
    const opts = document.createElement("div");
    opts.className = isPackage ? "clr-checks" : "clr-opts";
    q.options.forEach(opt => {
      const b = document.createElement("button");
      b.type = "button";
      if (isPackage) {
        b.className = "clr-check";
        b.innerHTML = '<span class="clr-box"></span>';
        const t = document.createElement("span");
        t.textContent = opt;
        b.appendChild(t);
      } else {
        b.className = "clr-opt";
        b.textContent = opt;
      }
      b.onclick = () => {
        if (card.classList.contains("done")) return;
        for (const sib of opts.children) sib.classList.remove("sel");
        b.classList.add("sel");
        if (isPackage) {
          const box = b.querySelector(".clr-box");
          for (const sib of opts.children) {
            const sbox = sib.querySelector(".clr-box");
            if (sbox) sbox.textContent = "";
          }
          if (box) box.textContent = "✓";  // checkmark on the picked box
        }
        selected[qi] = opt;
      };
      opts.appendChild(b);
    });
    qd.appendChild(opts);
    body.appendChild(qd);
  });
  card.appendChild(body);

  const foot = document.createElement("div");
  foot.className = "clr-foot";
  const hint = document.createElement("span");
  hint.className = "clr-hint";
  hint.textContent = "Pick options or type your own below";
  const go = document.createElement("button");
  go.type = "button";
  go.className = "clr-go";
  go.textContent = "Continue";
  go.onclick = () => {
    if (card.classList.contains("done")) return;
    const picks = [];
    data.questions.forEach((q, qi) => {
      if (selected[qi]) picks.push(q.label + ": " + selected[qi]);
    });
    if (!picks.length) { if (inputEl) inputEl.focus(); return; }
    card.classList.add("done");
    const txt = picks.join(". ") + ".";
    addUserRow(txt, []);
    showThinking(true);
    send({
      kind: "message",
      text: txt,
      project_path: projectPath,
      schematic_file: schematic,
      pcb_file: pcbFile,
      app: appCtx,
      attachments: [],
    });
  };
  foot.appendChild(hint);
  foot.appendChild(go);
  card.appendChild(foot);

  bubble.appendChild(card);
  scroll();
}

function finalizeStream(finalText) {
  let target = currentStream;
  if (!target && finalText) target = addRow("ai", "");
  if (target) target.classList.remove("streaming");   // stop the caret
  if (target && finalText) {
    if (looksLikeArchitecture(finalText)) {
      target.classList.add("has-card");
      target.innerHTML = renderArchitectureCard(finalText);
    } else if (looksLikeClarify(finalText)) {
      renderClarifyInto(target, finalText);
    } else {
      target.innerHTML = renderMd(finalText);
      decorateCodeBlocks(target);
      attachCopyButton(target);   // streaming's innerHTML resets wiped the one addRow() added
    }
  }
  currentStream = null;
  currentBuf = "";
}

function renderApproval(m) {
  const last = msgsEl.lastElementChild;
  let target;
  if (last && last.classList.contains("row") && last.classList.contains("ai")) {
    target = last.querySelector(".bubble");
  } else {
    target = addRow("ai", "");
  }
  if (Array.isArray(m.ops) && m.ops.length) {
    const wrap = document.createElement("div");
    wrap.className = "ops";
    const title = document.createElement("div");
    title.className = "ops-title";
    title.textContent = "Proposed operations (" + m.ops.length + ")";
    wrap.appendChild(title);
    for (const o of m.ops) {
      const t = o.op || o.type || "op";
      const args = Object.entries(o)
        .filter(([k]) => k !== "op" && k !== "type")
        .map(([k,v]) => k + "=" + JSON.stringify(v)).join(", ");
      const div = document.createElement("div");
      div.className = "op-item";
      div.textContent = t + "(" + args + ")";
      wrap.appendChild(div);
    }
    target.appendChild(wrap);
  }
  const row = document.createElement("div");
  row.className = "btn-row";
  const yes = document.createElement("button");
  yes.className = "btn primary"; yes.textContent = "Apply changes";
  const no = document.createElement("button");
  no.className = "btn secondary"; no.textContent = "Cancel";
  yes.onclick = () => {
    yes.disabled = true; no.disabled = true; yes.textContent = "Applying…";
    send({ kind: "approve", action_id: m.action_id });
  };
  no.onclick = () => {
    send({ kind: "reject", action_id: m.action_id });
    addSystem("Rejected.");
    row.remove();
  };
  row.appendChild(yes); row.appendChild(no);
  target.appendChild(row);
  scroll();
}

function readAsDataUrl(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function uploadFile(file) {
  const fd = new FormData();
  fd.append("file", file);
  fd.append("session_id", sessionId || "");
  const r = await fetch(httpBase + "/api/upload", { method: "POST", body: fd });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function renderPending() {
  pendEl.innerHTML = "";
  pending.forEach((p, i) => {
    const chip = document.createElement("span");
    chip.className = "chip";
    const icon = p.kind === "image" ? "🖼  "
               : p.kind === "pdf"   ? "📄  "
               : p.kind === "erc_report" ? "📝  "
               : "📎  ";
    chip.appendChild(document.createTextNode(icon + p.name));
    const x = document.createElement("span");
    x.className = "x"; x.textContent = "×";
    x.onclick = () => { pending.splice(i, 1); renderPending(); };
    chip.appendChild(x);
    pendEl.appendChild(chip);
  });
}

async function attach(file) {
  const isImg = /^image\//.test(file.type);
  const isPdf = /\/pdf$/.test(file.type) || /\.pdf$/i.test(file.name);
  const nameLc = (file.name || "").toLowerCase();
  const isReport = /\.rpt$/i.test(nameLc)
                || /\.erc\.txt$/i.test(nameLc)
                || (/\.txt$/i.test(nameLc) && nameLc.includes("erc"));
  if (!isImg && !isPdf && !isReport) {
    addError("Only image, PDF, or ERC report (.rpt / .txt) files are supported.");
    return;
  }
  const kind = isImg ? "image" : (isPdf ? "pdf" : "erc_report");
  const dataUrl = isImg ? await readAsDataUrl(file) : null;
  const entry = { name: file.name, kind, file, dataUrl, attachment_id: null };
  pending.push(entry);
  renderPending();
  try {
    const r = await uploadFile(file);
    entry.attachment_id = r.attachment_id || null;
    entry.server_name = r.filename || file.name;
  } catch (e) {
    addError("Upload failed: " + e.message);
    pending.splice(pending.indexOf(entry), 1);
    renderPending();
  }
}

async function sendChat() {
  const text = inputEl.value.trim();
  if (!text && pending.length === 0) return;

  if (text === "/clear" || text === "/reset") {
    inputEl.value = ""; autosize();
    if (send({ kind: "reset" })) addSystem("Conversation reset.");
    return;
  }

  const attachments = pending.slice();
  addUserRow(text || "(attachments only)", attachments);
  inputEl.value = ""; autosize();
  pending.length = 0; renderPending();
  showThinking(true);

  const ok = send({
    kind: "message",
    text,
    project_path: projectPath,
    schematic_file: schematic,
    pcb_file: pcbFile,
    app: appCtx,
    attachments: attachments.map(a => ({
      kind: a.kind,
      name: a.server_name || a.name,
      attachment_id: a.attachment_id
    }))
  });
  if (!ok) { showThinking(false); addError("Not connected — reconnecting."); connect(); }
}

// Cursor-style clean slate. Toggling the panel preserves the chat (the
// panel is a persistent shared webview, so the transcript otherwise lives
// for the whole app session); "New chat" is the explicit reset, matching
// Cursor's verified behaviour — brand-new session, zero prior memory, no
// summary carried forward. Bound to the + button and Ctrl/Cmd+N.
function newChat() {
  // 1) Drop the CURRENT session's memory on the server (uses the old id,
  //    which send() injects) BEFORE we rotate to a new one.
  send({ kind: "reset" });
  // 2) Rotate to a brand-new session id so the next turn starts empty.
  sessionId = (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID().replace(/-/g, "")
    : ("s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
  localStorage.setItem("envil_session_id", sessionId);
  // 3) Wipe the visible transcript but keep the empty-state welcome node.
  for (const node of Array.from(msgsEl.children)) {
    if (node !== emptyEl) node.remove();
  }
  if (emptyEl) emptyEl.style.display = "";
  // 4) Reset transient UI state.
  showThinking(false);
  currentStream = null; currentBuf = "";
  currentThink = null; currentThinkBody = null; currentThinkBuf = "";
  pending.length = 0; renderPending();
  inputEl.value = ""; autosize();
  // 5) Re-anchor the fresh session on the server (page_summary is disabled,
  //    so this emits no card — the panel stays blank like Cursor's new chat).
  if (ws && ws.readyState === WebSocket.OPEN) {
    send({ kind: "hello", project_path: projectPath,
           schematic_file: schematic, pcb_file: pcbFile, app: appCtx });
  }
  inputEl.focus();
}

function hasConversation() {
  for (const node of msgsEl.children) {
    if (node !== emptyEl) return true;
  }
  return false;
}

// Called by the C++ shell ONLY when the AI pane is actually shown (panel
// reopened) — NOT on schematic<->pcb tab flips. This is what gives the
// Cursor-style "blank on open": every time you reopen the panel it starts
// fresh. Guarded so it never destroys work in progress: skipped while a
// build is running, and a no-op when the panel is already blank.
window.envilPanelOpened = function () {
  if (thinkEl.classList.contains("active")) return;   // build in flight — keep it
  if (!hasConversation()) return;                      // already blank
  newChat();
};

function autosize() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
}

inputEl.addEventListener("input", autosize);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
});
// Ctrl/Cmd+N → new chat, matching Cursor's clean-slate shortcut.
window.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === "n" || e.key === "N")) {
    e.preventDefault();
    newChat();
  }
});
$("attachBtn").onclick = () => $("fileInput").click();
const sendBtnEl  = $("sendBtn");
const sendIconEl = $("sendIcon");
const stopIconEl = $("stopIcon");

function setBusy(on) {
  if (on) {
    sendBtnEl.classList.add("stop-mode");
    sendBtnEl.title = "Stop generation";
    sendIconEl.style.display = "none";
    stopIconEl.style.display = "";
  } else {
    sendBtnEl.classList.remove("stop-mode");
    sendBtnEl.title = "Send (Enter)";
    sendIconEl.style.display = "";
    stopIconEl.style.display = "none";
  }
}

sendBtnEl.onclick = () => {
  if (sendBtnEl.classList.contains("stop-mode")) {
    // Stop: tell the server to cancel, immediately reset UI
    send({ kind: "cancel" });
    turnActive = false;
    showThinking(false);
    setBusy(false);
    if (currentStream) {
      currentStream.classList.remove("streaming");
      if (!currentStream.innerText.trim()) currentStream.innerHTML = "<em style='opacity:.5'>Stopped.</em>";
    }
    currentStream = null; currentBuf = "";
  } else {
    sendChat();
  }
};
$("newChatBtn").onclick = () => newChat();
$("fileInput").onchange = async (e) => {
  for (const f of e.target.files) await attach(f);
  e.target.value = "";
};
document.querySelectorAll(".ex-chip").forEach(el => {
  el.onclick = () => { inputEl.value = el.dataset.msg; inputEl.focus(); autosize(); };
});

window.addEventListener("dragover", (e) => { e.preventDefault(); });
window.addEventListener("drop", async (e) => {
  e.preventDefault();
  for (const f of e.dataTransfer.files) await attach(f);
});

async function handlePaste(e) {
  const cd = e.clipboardData || window.clipboardData;
  if (!cd) return;
  const files = [];
  if (cd.files && cd.files.length) {
    for (const f of cd.files) files.push(f);
  } else if (cd.items) {
    for (const it of cd.items) {
      if (it.kind === "file") {
        const f = it.getAsFile();
        if (f) files.push(f);
      }
    }
  }
  if (!files.length) return;
  e.preventDefault();
  for (const f of files) {
    let file = f;
    if (!f.name || f.name === "image.png" || /^file$/i.test(f.name)) {
      const ext = (f.type.split("/")[1] || "png").replace("jpeg", "jpg");
      const ts = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
      file = new File([f], `pasted-${ts}.${ext}`, { type: f.type });
    }
    await attach(file);
  }
}
window.addEventListener("paste", handlePaste);

window.appendServerMessage = (s) => { try { handleSrv(JSON.parse(s)); } catch(e) { console.error(e); } };
window.updateFileContext = (_t, path) => showCtxFile(path);

console.log("[envil] chat.html loaded — backend=" + backendHost);
connect();
</script>
