<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anvil AI</title>
<style>
  /* ---- Anvil brand (NEMI): Space Grotesk / IBM Plex Mono,
     Signal Emerald #10A37E, Warm Graphite #292926, Black Ground #070707, Bone #ECE7DD ---- */
  :root {
    --emerald:      #10A37E;
    --emerald-dim:  #0B7A5E;
    --emerald-soft: rgba(16,163,126,.14);
    --ground:       #070707;
    --graphite:     #292926;
    --graphite-2:   #33332F;
    --bone:         #ECE7DD;
    --bone-dim:     #B8B4AA;
    --err:          #D9544F;
    --radius:       10px;
    --mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
    --sans: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--bone);
    font-family: var(--sans);
    font-size: 13.5px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- header ---------- */
  #hdr {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    background: var(--graphite);
    border-bottom: 1px solid #000;
    user-select: none;
  }
  #hdr .mark {
    width: 22px; height: 22px; border-radius: 6px;
    background: var(--emerald);
    display: grid; place-items: center;
    font-weight: 700; color: #04120D; font-size: 13px;
  }
  #hdr .title { font-weight: 600; letter-spacing: .02em; }
  #hdr .spacer { flex: 1; }
  #dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #6b6b64; transition: background .25s;
  }
  #dot.ok   { background: var(--emerald); box-shadow: 0 0 6px var(--emerald); }
  #dot.busy { background: #d9a63f; }
  #dot.err  { background: var(--err); }
  #stat { color: var(--bone-dim); font-size: 11.5px; }
  #newBtn {
    background: none; border: 1px solid var(--graphite-2); color: var(--bone-dim);
    border-radius: 7px; padding: 3px 10px; font: inherit; font-size: 11.5px; cursor: pointer;
  }
  #newBtn:hover { border-color: var(--emerald); color: var(--emerald); }

  /* ---------- context strip ---------- */
  #ctx {
    padding: 5px 14px;
    font-family: var(--mono); font-size: 10.5px;
    color: var(--bone-dim);
    background: #0d0d0c;
    border-bottom: 1px solid #1a1a18;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #ctx b { color: var(--emerald); font-weight: 500; }

  /* ---------- messages ---------- */
  #msgs {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
    scroll-behavior: smooth;
  }
  #msgs::-webkit-scrollbar { width: 8px; }
  #msgs::-webkit-scrollbar-thumb { background: var(--graphite-2); border-radius: 4px; }

  .msg { max-width: 92%; line-height: 1.5; word-wrap: break-word; }
  .msg.user {
    align-self: flex-end;
    background: var(--emerald-soft);
    border: 1px solid rgba(16,163,126,.35);
    border-radius: var(--radius) var(--radius) 3px var(--radius);
    padding: 8px 12px;
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--graphite);
    border: 1px solid #1c1c1a;
    border-radius: var(--radius) var(--radius) var(--radius) 3px;
    padding: 9px 13px;
  }
  .msg.sys {
    align-self: center;
    color: var(--bone-dim); font-size: 11px;
    font-family: var(--mono);
    padding: 1px 8px;
  }
  .msg.err {
    align-self: stretch;
    border: 1px solid rgba(217,84,79,.5);
    background: rgba(217,84,79,.08);
    color: #f0b5b2;
    border-radius: var(--radius);
    padding: 8px 12px;
    font-size: 12.5px;
  }

  /* markdown-lite inside ai messages */
  .msg.ai code {
    font-family: var(--mono); font-size: 12px;
    background: #0d0d0c; border: 1px solid #1c1c1a;
    border-radius: 4px; padding: 1px 5px;
  }
  .msg.ai pre {
    font-family: var(--mono); font-size: 12px;
    background: #0d0d0c; border: 1px solid #1c1c1a;
    border-radius: 8px; padding: 10px 12px; margin: 7px 0;
    overflow-x: auto; white-space: pre;
  }
  .msg.ai pre code { background: none; border: none; padding: 0; }
  .msg.ai strong { color: var(--emerald); font-weight: 600; }
  .msg.ai ul { margin: 5px 0 5px 18px; }
  .msg.ai li { margin: 2px 0; }

  /* tool/status chip while working */
  #busy {
    display: none;
    align-self: flex-start; align-items: center; gap: 8px;
    color: var(--bone-dim); font-size: 11.5px; font-family: var(--mono);
    padding: 4px 10px;
  }
  #busy.on { display: flex; }
  #busy .pulse {
    width: 8px; height: 8px; border-radius: 50%; background: var(--emerald);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .25; transform: scale(.8);} 50% { opacity: 1; transform: scale(1);} }

  /* ---------- input ---------- */
  #inbar {
    display: flex; gap: 8px; align-items: flex-end;
    padding: 10px 12px 12px;
    background: var(--graphite);
    border-top: 1px solid #000;
  }
  #inp {
    flex: 1; resize: none;
    min-height: 38px; max-height: 130px;
    background: #171716; color: var(--bone);
    border: 1px solid var(--graphite-2); border-radius: var(--radius);
    padding: 9px 12px;
    font: inherit; line-height: 1.4;
    outline: none;
  }
  #inp:focus { border-color: var(--emerald); }
  #inp::placeholder { color: #6f6b62; }
  .abtn {
    height: 38px; min-width: 62px;
    border: none; border-radius: var(--radius);
    font: inherit; font-weight: 600; cursor: pointer;
  }
  #send { background: var(--emerald); color: #04120D; }
  #send:hover { background: #13B98F; }
  #send:disabled { background: var(--graphite-2); color: #6f6b62; cursor: default; }
  #stop { background: none; border: 1px solid var(--err); color: var(--err); display: none; }
  #stop.on { display: block; }
</style>
</head>
<body>

  <div id="hdr">
    <div class="mark">A</div>
    <div class="title">Anvil&nbsp;AI</div>
    <div class="spacer"></div>
    <span id="stat">starting…</span>
    <div id="dot"></div>
    <button id="newBtn" title="Start a new conversation">New</button>
  </div>

  <div id="ctx">no project</div>

  <div id="msgs">
    <div class="msg sys">Anvil AI — design circuits, edit the open schematic, run ERC/DRC. Type below.</div>
    <div id="busy"><div class="pulse"></div><span id="busyTxt">working…</span></div>
  </div>

  <div id="inbar">
    <textarea id="inp" rows="1" placeholder="Describe a circuit, or ask for a change…"></textarea>
    <button id="stop" class="abtn">Stop</button>
    <button id="send" class="abtn">Send</button>
  </div>

<script>
"use strict";
/* =============================================================
   Anvil AI chat — fresh UI.
   Bridge OUT (JS -> C++): window.anvilSend.postMessage(JSON string)
     kinds: hello | message{text} | cancel | reset | ping
   Bridge IN  (C++ -> JS): window.anvilRecv(JSON string)
     kinds: ready | status{text} | thinking{text} | reply{text}
            | done | error{text} | pong
   Context   (C++ -> JS): window.anvilSetContext(project, sch, pcb, app)
   ============================================================= */

const $ = (id) => document.getElementById(id);
const msgs = $("msgs"), busy = $("busy"), busyTxt = $("busyTxt");
const inp = $("inp"), sendBtn = $("send"), stopBtn = $("stop");
const dot = $("dot"), stat = $("stat"), ctxEl = $("ctx");

let sessionSeq = 1;
let turnOpen = false;
let curAiEl = null;              // streaming target for reply chunks
let ctx = { project: "", sch: "", pcb: "", app: "" };

/* ---------- outbound bridge ---------- */
function post(obj) {
  obj.seq = sessionSeq;
  try {
    if (window.anvilSend && window.anvilSend.postMessage)
      window.anvilSend.postMessage(JSON.stringify(obj));
    else
      setStatus("err", "no bridge");
  } catch (e) { setStatus("err", "bridge error"); }
}

/* ---------- UI helpers ---------- */
function setStatus(kind, text) {
  dot.className = kind === "ok" ? "ok" : kind === "busy" ? "busy" : kind === "err" ? "err" : "";
  stat.textContent = text || "";
}
function scrollEnd() { msgs.scrollTop = msgs.scrollHeight; }

function addMsg(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  if (cls === "ai") d.innerHTML = mdLite(text);
  else d.textContent = text;
  msgs.insertBefore(d, busy);
  scrollEnd();
  return d;
}

/* minimal safe markdown: escape first, then bold/code/fences/bullets */
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function mdLite(raw) {
  let s = esc(raw);
  s = s.replace(/```([\s\S]*?)```/g, (m, body) => "<pre><code>" + body.replace(/^\n/, "") + "</code></pre>");
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  // bullet lines -> list items (simple, per-line)
  s = s.replace(/(^|\n)[ \t]*[-•] (.+)/g, "$1<li>$2</li>");
  s = s.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, "<ul>$1</ul>");
  s = s.replace(/\n/g, "<br>");
  s = s.replace(/<\/li><br>/g, "</li>").replace(/<\/ul><br>/g, "</ul>").replace(/<br><ul>/g, "<ul>").replace(/<br><pre>/g, "<pre>").replace(/<\/pre><br>/g, "</pre>");
  return s;
}

function setBusy(on, text) {
  busy.className = on ? "on" : "";
  if (text) busyTxt.textContent = text;
  stopBtn.className = "abtn" + (on ? " on" : "");
  sendBtn.disabled = on;
  if (on) setStatus("busy", "working"); else setStatus("ok", "ready");
  scrollEnd();
}

/* ---------- inbound bridge ---------- */
window.anvilRecv = function (jsonStr) {
  let ev;
  try { ev = JSON.parse(jsonStr); } catch { return; }
  switch (ev.kind) {
    case "ready":
      setStatus("ok", "ready");
      break;
    case "pong":
      break;
    case "status":                       // tool / phase updates while working
      setBusy(true, ev.text || "working…");
      break;
    case "thinking":                     // model reasoning summary (optional)
      setBusy(true, ev.text ? ("thinking: " + ev.text.slice(0, 60)) : "thinking…");
      break;
    case "reply":                        // assistant text (may arrive in chunks)
      if (!curAiEl) curAiEl = addMsg("ai", "");
      curAiEl._raw = (curAiEl._raw || "") + (ev.text || "");
      curAiEl.innerHTML = mdLite(curAiEl._raw);
      scrollEnd();
      break;
    case "done":
      turnOpen = false; curAiEl = null;
      setBusy(false);
      break;
    case "error":
      addMsg("err", ev.text || "Unknown error");
      turnOpen = false; curAiEl = null;
      setBusy(false); setStatus("err", "error");
      break;
  }
};

/* C++ pushes live document context here (any arg may be empty) */
window.anvilSetContext = function (project, sch, pcb, app) {
  const changedProject = project && project !== ctx.project;
  ctx = { project: project || "", sch: sch || "", pcb: pcb || "", app: app || ctx.app };
  const bits = [];
  if (ctx.project) bits.push("<b>proj</b> " + esc(shortPath(ctx.project)));
  if (ctx.sch) bits.push("<b>sch</b> " + esc(baseName(ctx.sch)));
  if (ctx.pcb) bits.push("<b>pcb</b> " + esc(baseName(ctx.pcb)));
  ctxEl.innerHTML = bits.length ? bits.join(" &nbsp;·&nbsp; ") : "no project";
  if (changedProject) newChat(true);     // different project => fresh conversation
};
function baseName(p) { return (p || "").split(/[\\/]/).pop(); }
function shortPath(p) {
  const parts = (p || "").split(/[\\/]/).filter(Boolean);
  return parts.length > 2 ? "…/" + parts.slice(-2).join("/") : p;
}

/* panel shown (C++ calls when user opens the AI pane) */
window.anvilPanelOpened = function () { inp.focus(); };

/* ---------- actions ---------- */
function sendChat() {
  const text = inp.value.trim();
  if (!text || turnOpen) return;
  addMsg("user", text);
  inp.value = ""; autoSize();
  turnOpen = true; curAiEl = null;
  setBusy(true, "working…");
  post({ kind: "message", text: text, context: ctx });
}
function newChat(silent) {
  sessionSeq++;
  turnOpen = false; curAiEl = null;
  post({ kind: "reset" });
  if (!silent) {
    msgs.querySelectorAll(".msg").forEach(m => m.remove());
    addMsg("sys", "new conversation");
  }
  setBusy(false);
}

sendBtn.addEventListener("click", sendChat);
stopBtn.addEventListener("click", () => { post({ kind: "cancel" }); setBusy(false); });
$("newBtn").addEventListener("click", () => newChat(false));

inp.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
});
function autoSize() {
  inp.style.height = "auto";
  inp.style.height = Math.min(inp.scrollHeight, 130) + "px";
}
inp.addEventListener("input", autoSize);

/* ---------- boot ---------- */
(function boot() {
  // context may arrive via query params on first load
  const q = new URLSearchParams(location.search);
  window.anvilSetContext(q.get("project") || "", q.get("schematic") || "", q.get("pcb") || "", q.get("app") || "");
  post({ kind: "hello", context: ctx });
  setStatus("ok", "ready");
  autoSize();
})();
</script>
</body>
</html>
